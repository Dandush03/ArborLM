[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "arborlm"
version = "0.1.0"
description = "ArborLM E0 CPU research baseline"
requires-python = "==3.12.*"
license = {file = "LICENSE"}
dependencies = ["torch==2.8.0", "psutil==7.0.0"]

[project.optional-dependencies]
pilot = ["pyarrow==21.0.0"]

[dependency-groups]
dev = ["pytest==8.4.1", "ruff==0.12.12", "mypy==1.17.1", "hatchling==1.27.0"]

[tool.uv]
environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.uv.sources]
torch = [{index = "torch-cpu", marker = "sys_platform == 'linux'"}]

[[tool.uv.index]]
name = "torch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["psutil", "pyarrow.*", "pyarrow"]
ignore_missing_imports = true
