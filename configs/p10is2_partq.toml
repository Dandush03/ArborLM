wilson_z = 1.959963984540054
q4_precision_min = 0.90
q4_min_accepted = 150

[scoring]  # chrF-norm as ADR-0022 section 10.1
chrf_max_order = 6
chrf_beta = 2.0
regeneration_score_tolerance = 1.0e-4

[generation]  # section 4.3
split_share_b = 0.8           # the registered split, 4/5; 0.804 is a rationale only and is not a parameter
accepted_min = 10000
accepted_disjoint = 24000
replicates = 3
per_replicate = 8000
generation_block_sources = 20000
batch_size = 32
threads = 6
