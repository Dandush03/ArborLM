# ADR-0025 (P10-I-S2) Part Q constants. Every value is quoted from the ADR section named in its comment; none was chosen by the implementer.
# tests/test_p10is2_config.py compares this file with the ADR's numbers (ruling L6). Not frozen. Self-check only; Astra review: NOT_PERFORMED.

schema_version = 1
study = "P10IS2"
part = "Q"
spec_reference = "docs/decisions/ADR-0025-p10-i-s2-sequential-teacher-transfer.md"

[panels]  # section 4.1
q_fit = 2000                  # fixed, never extended
q_check_block = 500
q_check_blocks_max = 16
d_cal = 500
d_con = 300
e_eval = 1000                 # E_A, E_B
e_eval_min = 500
e_combined = 500              # E_C
e_combined_min = 250
e_open = 500
both_reference_min_train = 3300   # Q_fit + D_cal + D_con + one Q_check block
gen_marker_like = 44
gen_ordinary = 100
general_window_tokens = 256

[data]  # as ADR-0022 section 5.2 (carried; ADR-0025 section 3 row 4)
vocabulary = 2000
min_words = 3
max_words = 10
large_group_pairs = 50
evaluation_fraction = 0.20

[quality]  # section 4.2
