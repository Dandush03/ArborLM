# P10-I-S5 (ADR-0028) frozen constants: the engineering part, a device cost-model study of the human lead's internal SSD.
# Every threshold of the study lives here and nowhere else; the ADR text is not a frozen input (it is hashed for provenance only).
# A test asserts that each value below equals the value of the ADR section named beside it.
# Not frozen. No registered run is approved. The scientific part is not implemented (it is NOT EVALUABLE as capped, ADR-0028 section 3.2).
