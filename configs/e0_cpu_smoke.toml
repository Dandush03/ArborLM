schema_version = 1
experiment_family = "E0"
question_id = "G0"
spec_reference = "docs/decisions/ADR-0003-e0-approved-spec.md"

[data]
generator = "sha256-cycle8-v1"
tokenizer = "integer-identity-v1"
vocab_size = 16
motif_length = 8
row_length = 33
train_seed = 101
validation_seed = 202
train_rows = 256
validation_rows = 64
packing = false

[model]
architecture = "dense-causal-pre-layernorm"
blocks = 2
width = 32
heads = 4
head_width = 8
ffn_width = 64
context_length = 32
position_embedding = "learned-absolute"
layer_norm_epsilon = 0.00001
qkv_projection = "combined-biased"
attention = "explicit-scaled-dot-product-causal-diagonal"
activation = "gelu-exact"
tied_output = true
output_bias = false
dropout = 0.0
init_mean = 0.0
init_std = 0.02
bias_init = 0.0
norm_scale_init = 1.0
parameters = 18688

[training]
device = "cpu"
dtype = "float32"
torch_seed = 42
python_seed = 42
threads = 1
interop_threads = 1
deterministic_algorithms = true
deterministic_warn_only = false
steps = 32
batch_size = 8
accumulation = 1
row_order = "cyclic"
workers = 0
objective = "mean-next-token-cross-entropy"
optimizer = "AdamW"
learning_rate = 0.003
betas = [0.9, 0.999]
epsilon = 0.00000001
weight_decay = 0.0
amsgrad = false
foreach = false
fused = false
gradient_clip_norm = 1.0
error_if_nonfinite_gradients = true
zero_grad_set_to_none = true
mixed_precision = false
compile = false
scheduler = false
checkpoint_steps = [16, 32]

[evaluation]
steps = [0, 32]
batch_size = 8
reduction = "sum-cross-entropy-divided-by-valid-targets"
nll_units = "nats_per_target_token"

[limits]
process_seconds = 300
smoke_seconds = 1500
rss_bytes = 2147483648
poll_seconds = 0.1
