[choices]
c01_alphabet = "32 contiguous printable ASCII bytes 0x40..0x5F ('@', A-Z, '[', backslash, ']', '^', '_')"
c02_template_pool = "count every byte in the first 2048 rows (ranks 0..2047, the rows the backbones were trained on) of the frozen P5 train.bytes (SHA-256 verified against P1_TRAIN_SHA256, 65 bytes per row); drop the 32 alphabet bytes; sort by (count descending, byte ascending); take 48"
c03_template_split = "random.Random(templates_seed).shuffle of the 48-byte pool in rank order; positions 0-31 -> T (0-15 separators, 16-31 binding bytes, paired by index), 32-39 -> H1, 40-47 -> H2 (first four separators, last four binding bytes); 8 of the 16 (separator, binding) combinations per held-out set by random.Random(templates_seed + 1)"
c04_fact_nesting = "one seeded fact table: proportional facts are the first F facts, so the fixed track and the 4,096-slot cells use the same 2,048 facts as a prefix; cluster of fact i is i // 16 after the seeded fact order; unseen controls follow the trained facts; Lane D sets A (ids 0..4095) and B (4096..8191) form a second table whose identifiers avoid the main table's"
c05_snapshot_rounding = "none needed: U = F*E/128 is an even integer for every registered F and E"
c06_run_length = "non-Lane-D cells run max(U, U_16K) updates, so the fixed-track cells also run to U_16K; Lane D cells run exactly U (E exposures per phase) with snapshots U/2 and U"
c07_replay = "a replay arm uses 16 B contexts plus 16 replayed A contexts per update; update count = U"
c08_dense_adapter = "bias-free 32 -> h -> 32, one gate, h = (P_flat_key16 - 1) // 64, flat key-16 count at the same N"
c09_g1_tests = "k = 8 independence tests per stream (identifier positions 1-5, template, cluster, record index); permutations = 2000 * k"
c10_exact_unseen = "exact retrieval answers unseen facts with symbol index 0"
c11_exposure_rule = "sizes failing 0.95 at E = 128 are TASK_CEILING_FAIL and excluded when choosing E"
c12_rehearsal_seeds = "draw k uses 179001 + 100k + i for the 14 data seeds, null seeds at +20 and +30"
c13_run_names = "P9<code>-<utc %Y%m%dT%H%M%S%fZ>-<uuid4 hex>, code per stage in RUN_STAGE_CODES"
c14_dependencies = "Cell.depends_on holds training dependencies only; analysis dependencies are block-level"
c15_interval_tails = "central interval: tail mass 0.001 / (2 * tests) on each side, counts, not accuracies"
c16_r2_aggregation = "calibration R2 accuracy of a size and exposure = minimum over panels A and B and over all calibration runs (B101 seeds 1701 and 1702, B102 seed 1701), the conservative reading of 'R2 reaches 0.95 on the rehearsal panels'"
c17_calibration_controls = "frozen-hidden probes store the calibration stream restricted to F facts and are scored on Panel A restricted to F facts (trained facts only); attainable answer probability on Panel A restricted to the smallest fact count; no-memory and exact controls on Panels A and B"
c18_g2_parent = "the G2 no-memory family is counted on parent B101; parent B102 is counted and reported beside it and enters no rule"
c19_init_seed_offsets = "outside a registered run the initialization seed of a cell is the rehearsal facts seed plus (cell seed - 1701), so the two seeds of a calibration or DRY cell differ; a registered run uses 1701 and 1702"
c20_dry_profile = "DRY profile: registered labels, slots, rungs and dependencies, facts scaled to 128 / 256 / 512 (proportional), 128 per Lane D set, 64 unseen controls, test draw 90 (seeds >= 179001); outputs carry a DRY banner"
c21_rehearsal_timing = "rehearsal cells are timed one at a time (no concurrent workers) and the contention cell is timed with 1, 2, 4 and 8 workers; seconds per update = wall seconds of the run / updates, so it includes model construction and the final snapshot write; evaluation and simulation are timed into a scratch directory that is deleted"
c22_lane_d_bytes = "Lane D bytes changed counts every changed addition tensor (keys, values, projections, gate, router) and the keys-and-values-only count is reported beside it"
