annotation_margin = 0.03
joint_bound_ratio = 0.90
task_coded_retention_margin = 0.10
router_accuracy_min = 0.99
composes_ratio_min = 0.80          # H_a >= 0.80 per answer (combined-tasks addendum section 8); also revision 5's replaced ratio
composes_negative = 0.50           # DOES NOT COMPOSE: H_a < 0.50 in every replicate of some order (the human lead agreed)
exact_match_weak = 0.10
training_cost_ratio_max = 1.5
value_rows_ratio_max = 0.10
student_equivalence_tolerance = 1.0e-3
mps_loss_tolerance = 1.0e-3
mps_parameter_relative_tolerance = 1.0e-4
g4_repeat_updates = 20

[recompute]  # section 13.3
