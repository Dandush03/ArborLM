# ADR-0022 revision 5 (P10-S2) registered constants. Every value below is quoted from the ADR section named in its comment;
# none was chosen by the implementer. tests/test_p10s2_core.py compares this file with the ADR numbers. Implementation with
# tests on synthetic stand-ins only (ADR-0022 section 18, "Lead's approval for implementation on synthetic stand-ins").
# Astra review: NOT_PERFORMED. Self-check only.

schema_version = 1
experiment_family = "P10S2_TWO_TEACHER_TRANSFER"
spec_reference = "docs/decisions/ADR-0022-p10-s2-two-teacher-transfer.md"
spec_revision = 5

[memory]  # section 3
key_width = 16
top = 8
temperature = 0.2
rows_per_stage = 4096
init_std = 0.02            # keys and values, normal
read_layers = [4, 12]      # calibration chooses; the read is the output of block L, 0-based block index (see studies/p10s2/model.py)

[student]  # section 2 (pinned config.json values; rms_norm_eps is not here: it is read from the model's own config.json at load and checked by gate G8)
vocab = 49152
width = 576
layers = 30
heads = 9
kv_heads = 3
intermediate = 1536
max_positions = 8192
rope_base = 100000.0
parameters = 134515008

[teachers]  # section 4.1
parameters = [73944309, 74669178]
own_score_min = 0.55
margin_min = 0.30
accepted_pool_min = 8000

[training]  # sections 6, 7, 12.1
batch = 32
clip_norm = 1.0
weight_decay = 0.0
updates = [2000, 1000]
store_learning_rate = 0.003
lora_learning_rates = [0.0003, 0.001]
lora_rank_single = 42
lora_rank_joint = 84
lora_alpha_equals_rank = true
calibration_snapshot_updates = 1000
calibration_selection_min_difference = 0.01
replay_rows = 32
init_std = 0.02            # section 3 values/keys; E-table section 7
retention_check_drop = 0.02
modification_floor = 0.10

[router]  # section 5.4
updates = 500
batch = 64
learning_rate = 0.001
none_prefixes = 8000
none_prefixes_full_length = 4000
prefix_tokens = 64
temperature = 0.2
init_std = 0.02
false_trigger_windows = 100

[data]  # section 5.2, 5.3, 6.4
vocabulary = 2000
min_words = 3
max_words = 10
large_group_pairs = 50
evaluation_fraction = 0.20
panel_eval = 1000
panel_eval_min = 500
panel_combined = 500
panel_combined_min = 250
panel_open = 500
panel_q_fit = 500
panel_q_check = 500
panel_d_cal = 500
panel_d_con = 300
accepted_per_replicate = 8000
gold_per_replicate = 8000
sufficiency_factor = 1.25
generation_sources_max = 60000
generation_beam = 4
generation_new_tokens = 48
truncation_percentile = 0.995
ablation_subsample = 300
seen_items = 300
general_windows = 144               # the GEN panel: every marker-like window of the fixed grid plus the sampled ordinary windows (ruling of 2026-11-16)
general_windows_marker_like = 44    # the marker-like stratum is every window of it on the fixed grid; 44 is the count the rule finds in WikiText-2 validation, and any other count stops the step
general_windows_ordinary = 100      # sampled with the GEN-window seed 220905
general_window_tokens = 256
router_decision_token = 64
tokenizer_record_sentences = 100
random_id_sequences = 1000
marker_strings = ["German", "French", "English", "translation"]
marker_line_ending = ":"

[filter]  # section 5.3
tau_grid = [-0.05, -0.10, -0.15, -0.20, -0.25, -0.30, -0.35, -0.40, -0.45, -0.50, -0.55, -0.60]
ratio_ranges = [[0.5, 2.0], [0.6, 1.6]]
chrf_correct = 0.60
wilson_lower_bound = 0.90
check_precision = 0.90
check_min_accepted = 150
wilson_z = 1.959963984540054

[scoring]  # section 10.1
chrf_max_order = 6
chrf_beta = 2.0
gap_denominator_min = 0.30
bootstrap_resamples = 10000
crosscheck_tolerance = 0.001

[gates]  # section 11.1 to 11.4, 12.2
acq_gap_min = 0.50
acq_margin_min = 0.30
acq_marker_only_max = 0.25
acq2_ratio_min = 0.80
ret_drop_max = 0.03
ret_gap_ratio_min = 0.90
