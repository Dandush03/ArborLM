# ADR-0025 (P10-I-S2) Part T constants. Every value is quoted from the ADR section named in its comment; none was chosen by the implementer.
# tests/test_p10is2_config.py compares this file with the ADR's numbers (ruling L6). Not frozen. Self-check only; Astra review: NOT_PERFORMED.

schema_version = 1
study = "P10IS2"
part = "T"
spec_reference = "docs/decisions/ADR-0025-p10-i-s2-sequential-teacher-transfer.md"
rulings_addendum = "docs/decisions/ADR-0025-addendum-part-t-rulings.md"  # the lead's rulings 1-15 on the Part T implementation (2026-11-20): they bind as the ADR does
rulings_addendum_sha256 = "13b472dc0c0e9fac7100221f4f5bde7610b59aae3df1ce201a158652152ad14e"

[memory]  # section 5.2 (as ADR-0022 section 3)
rows_per_stage = 4096
key_width = 16
top = 8
temperature = 0.2
init_std = 0.02
read_layers = [4, 12]
lora_rank_single = 42
lora_rank_joint = 84
vector_width = 576
replay_rows = 32

[training]  # section 5.1
batch = 32
clip_norm = 1.0
weight_decay = 0.0
checkpoint_every = 500
replicates = 3
orders = ["AB", "BA"]
training_device = "mps"
scoring_device = "cpu"
threads = 6
interop_threads = 1

[calibration]  # section 7.1
store_rates = [0.001, 0.003, 0.01]
lora_rates = [0.0001, 0.0003, 0.001]
rate_grid_updates = 2000
rate_grid_read_layer = 4
rate_tie_tolerance = 0.01
ladder_rungs = [1000, 2000, 4000]
ladder_snapshots = [1000, 2000, 4000, 8000]
ladder_top = 8000
convergence_tolerance = 0.01
repetitions_provided = 1

[rehearsal]  # section 10: both rehearsals train 200 updates of every trained cell type and need no calibration result; the rates and the layer are the grid's own starting values, used for timing only
updates = 200
store_rate = 0.003
lora_rate = 0.0003
etable_rate = 0.003
read_layer = 4

[calibration_log]  # ruling 35: where the calibration log is pushed; the human lead fills these (empty refuses)
remote_url = "https://github.com/Dandush03/ArborLM"
remote_branch = "claude/p10-i-s2-impl"

[pilot]  # section 7.2
gap_min = 0.25

[data]  # section 5.3
gap_denominator_min = 0.30
control_subsample = 300
eval_panel = 1000
d_con_panel = 300          # D_con (section 4.1): the size the units of the caps count (the Part Q bundle holds it)
first_not_acquired_g = 0.50
d_cal_panel = 500          # D_cal (section 4.1): its real size, which the calibration cap's scoring counts
seen_items = 300           # the seen-item reads (section 8.5): Part Q's seen order, 300 per capability
e_open_panel = 500         # E_open (section 4.1): the size the units of the caps count (the panel holds the items with a reference in the capability's language)

[gates]  # section 8.2, 8.3
acq_gap_min = 0.50
acq_margin_min = 0.30
acq_marker_only_max = 0.25
acq2_ratio_min = 0.80
ret_forgetting_max = 0.03
ret_rho_min = 0.90
negative_acquisition = 0.25
negative_retention = 0.70
forgetting_pressure_cells = 4
forgetting_pressure_second_min = 0.50
forgetting_pressure_rho_max = 0.90
retention_negative_min_cells = 4
control_failed_gap = 0.50
gen_loss_margin = 0.02
dense_margin = 0.05
lookup_sufficient_margin = 0.03
lookup_adds_margin = 0.05
second_not_acquired = 0.50
modification_dcon_tolerance = 0.02
modification_floor = 0.10
composes_ratio_min = 0.80
composes_negative = 0.50
cells_per_arm = 6
mps_loss_tolerance = 1.0e-3                  # gate G4, MPS against CPU (ADR-0022 section 12.3, carried by ADR-0025 section 7.3)
mps_gradient_relative_tolerance = 1.0e-3     # ruling 39 (the amended G4-MPS): gradient agreement at identical parameters, fixed as the figure already registered for the loss condition of the same gate
mps_parameter_relative_tolerance = 1.0e-4    # SUPERSEDED by ruling 39: recorded after 20 updates, never gating (it was written without a measurement and failed at 1.48e-2 on 2026-11-20; see docs/decisions/ADR-0025-addendum-part-t-g4-mps-amendment.md)
g4_repeat_updates = 20
recompute_item_tolerance = 1.0e-6

[arms]  # section 5.2
stage_rows = 4096
memory_arms = ["M1", "M-append", "M-seq", "M-ii", "M-joint"]
dense_arms = ["D1", "D-append", "D-seq", "D-joint"]
by_construction_arms = ["E-table", "M-sep", "D-sep"]
lookup_baselines = ["R-exact", "R-gloss", "R-gloss-icl", "R-nn", "R-icl"]
lookup_best_of = ["R-gloss", "R-gloss-icl", "R-nn", "R-icl", "E-table"]
combined_arm_cells = ["M-append", "M-ii", "D-seq", "D-append", "M-joint", "D-joint", "M-sep", "D-sep"]
timed_arms = ["S0", "M-append", "D-append", "D-seq", "E-table", "R-icl"]

[seeds]  # section 6 and SEED_REGISTRY.md section 4.2
replicate_bases = [250001, 250101, 250201]
offsets = [1, 2, 4, 10, 13]               # training draw, batch order, permutation controls, code hash, router none prefixes and batch order
calibration_bases = [251001, 251101]       # 251001 + 100 i, i = 0, 1
repeat_calibration_bases = [251201, 251301]
rehearsal_base = 252001
analysis_bootstrap = 250915
route_accuracy_pieces = 250918
init_registered = [330201, 330211, 330221]   # + role j
init_calibration = [330231, 330241]
init_repeat_calibration = [330261, 330271]   # listed values, never the formula 330231 + 10 i at i = 2
init_rehearsal = 330251
init_test = [330281, 330289]   # revision 5 of the seed registry: 330281 + 8 i + j (the ADR's 330298, 330299 ran onto P10-I-S3's registered initialisation seeds)
route_pieces_offset = 18        # outside registered mode the route-accuracy pieces use base + 18 (251019, 251119, 251219, 251319, 252019), never the router seed (base + 13)
g5_probe = 250919               # gate G5's probe queries in the registered gates stage (registry revision 5)
g5_probe_test = 934900          # the same probe outside registered mode (test range)
init_roles = ["stage-1 store", "appended rows", "M-joint store", "D1", "second adapter of D-append", "D-joint", "E-table", "router projection and keys"]
test_low = 934001
test_high = 934999
allocation_low = 250001
allocation_high = 250899
rehearsal_set_low = 252001
rehearsal_set_high = 252899
init_low = 330201
init_high = 330299
registry_checker = "docs/reviews/p10-i-direction-2026-11-17/seed_registry_check_r7.py"   # revision 7 (ruling 45): revision 6 plus P10-I-S1 and P10-I-S6 as owners of their own files, nothing else
registry_checker_sha256 = "1f3b2de22ef3ff9bd01d81d67d7fcccac27710ed3394b62bec9c0688bc8b8f8f"
registry_addendum = "docs/reviews/p10-i-direction-2026-11-17/SEED_REGISTRY_R7.md"
registry_addendum_sha256 = "528aa3066e4dfafb09a2a3aeb54b5df24bc4b1f2b9d8f3742d2cdee3722f2adc"
own_file_globs = ["configs/p10is2_*", "studies/p10is2/*", "tests/test_p10is2_*"]   # the checker's built-in owner of this study (no --own needed)

[caps]  # sections 9, 10
measuring_rehearsal_hours = 6.0   # ruling 40: the ONE extension of the fixed 3.0 h (ADR-0025 section 10) to twice its value, the most extension_factor_max allows; docs/decisions/ADR-0025-addendum-part-t-rulings-9.md
rehearsal_hours = 3.0
extension_factor_max = 2.0
provisional = true
study_budget_hours = 95.68   # ruling 41 (lead, under the human lead's delegation of 2026-11-20; he may overrule): 110 h (ADR-0025 upper figure) minus Part Q's 14.311 h charged
memory_per_worker_gib = 8.0
memory_aggregate_gib = 24.0
workers_max = 3
workers_max_shared = 2
disk_gib = 10.0

[timing]  # section 10, stage 7 (descriptive; runs alone)
threads = 6
items_per_panel = 200
repetitions = 3
quiet_load_max = 2.0
quiet_wait_seconds = 60
start_bound_minutes = 30
max_attempts = 5
unstable_cv = 0.05

[cost]  # section 8.5
batch = 32

[platform]  # section 11 item 10 (as Part Q)
system = "Darwin"
machine = "arm64"
torch = "2.8.0"
torch_num_threads = 6
deterministic_algorithms = true

[stage_caps]  # section 10 item 3: computed by code from the Part T measuring rehearsal; 0.0 = not yet set
gates_hours = 0.0
calibration_hours = 13.18
train_hours = 0.0
evaluate_hours = 0.0
controls_hours = 0.0
combined_hours = 0.0
recompute_hours = 0.0
analysis_hours = 0.0
report_hours = 0.0
total_hours = 0.0
