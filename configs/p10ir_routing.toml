# P10-I-R (ADR-0029) frozen constants. Every threshold of the study lives here and nowhere else; the ADR text is not a frozen input
# (it is hashed for provenance only). A test asserts that each value below equals the value of the ADR section named beside it.
# Not frozen yet. No registered run is approved: the freeze and the registered stages need Decision 2.
schema_version = 1
experiment_family = "P10IR_ROUTING_DIAGNOSIS"
spec_reference = "docs/decisions/ADR-0029-p10-i-r-routing-diagnosis.md"

[thresholds]
# section 8.1: the retention rule, in bits per fact (i of studies/p10s1/core.py bits_per_fact)
gap_bits = 0.5                 # a gap exists if i(Y) - i(X) >= 0.5
restored_margin_bits = 0.25    # RESTORED needs i(Y) - i(X) <= 0.25 ...
restored_ratio = 0.90          # ... and i(X) >= 0.90 i(Y)
floor_a_use = 0.25             # i(Y) >= 0.473 bits (a_use 0.25), derived as Fano(0.25); below it: WEAK REFERENCE
floor_i_bits_printed = 0.473   # the printed value of Fano(0.25); a test requires round(Fano(0.25), 3) == this
# section 8.3
h_margin_bits = 0.25           # H: i(T2) <= i(T0) - 0.25 on both panels (its own key; same value as restored_margin_bits by the ADR)
closure = 0.5                  # closure figure: "most of the gap"
recall_r = 0.90                # R: CR8(T0) >= 0.90
# section 9
plateau_gain_bits = 0.10       # i*(run) - i*(run/2) <= 0.10, and i*(run/2) >= the floor above
still_learning_min_replicates = 2  # the STILL LEARNING tag if the plateau check fails in at least 2 of 5 replicates
# section 8.4
tree_candidates = 512          # the tree's candidate count: the equal-candidate standard
# section 8.2
replicates = 5                 # the denominator is always 5
label_min_replicates = 4       # a cell's label is the row held by at least 4 of 5
not_evaluable_min_replicates = 2  # a cell is NOT EVALUABLE if at least 2 of 5 are

[gates]
# section 11 gate 4 (third review R3-6)
tie_margin = 1e-5              # float tie: the 8th and 9th largest scores differ by at most 1e-5 (float32) in either computation
weight_tolerance = 1e-6        # weights equal within 1e-6 absolute, slot by slot
tie_share_max = 0.001          # more than 0.1% of facts at a float tie fails the gate

[reads]
# section 6
visit_sweep = [1, 2, 4, 8]     # v <= N/256
index_budgets = [128, 256, 512, 1024, 2048]   # c < N
index_list_size = 64           # I64: k-means into N/64 lists
index_standard_budget = 512    # I256@512, the registered index
index_standard_list_size = 256
lloyd_iterations = 10
branch_size = 256
visit_registered = 2
top = 8
temperature = 0.2
shallow_slots = 1024           # four branches: SHALLOW

[seeds]
# section 5 (docs/reviews/p10-i-direction-2026-11-17/SEED_REGISTRY.md section 4.2)
bridge_base = 290001
bridge_stride = 100
bridge_draws = 5
bridge_index_offset = 60
bridge_init_base = 330600      # draw d -> 330600 + d
index_seeds = [298001, 298002, 298003]
test_index_seeds = [938901, 938902, 938903]   # rehearsal and tests read the I64 indexes with these (test range), never with the registered index seeds above
rehearsal_base = 299201
rehearsal_init = 330692
test_init = [330698, 330699]
test_range = [938001, 938999]
# declared re-use, not an allocation (section 5): P10-S1's registered draws and one cell for the adapter identity gate
p10s1_draw_base = 210001
p10s1_draw_stride = 100
p10s1_index_offset = 60
p10s1_init_base = 2100         # draw r -> 2100 + r
identity_gate_draw = 1
identity_gate_updates = [512, 1024, 2048]
identity_gate_cell = [8192, 4096]

[a2]
# section 10: the bridge block
learning_rate = 0.003
arms = ["F-OQ", "T-OQ"]
cells = [[8192, 4096], [32768, 16384]]

[[cells]]
# section 4: the seven cells of stage A1; role primary / printed / loaded (section 9)
facts = 2048
slots = 1024
role = "printed"
u_p = 8192
run = 49152
trajectory = [16384, 32768]

