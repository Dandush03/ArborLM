[resources]
# section 12 and 13
workers = 6
rss_worker_bytes = 3221225472        # 3 GiB per worker
rss_aggregate_bytes = 19327352832    # 18 GiB aggregate
eval_chunk_elements = 1048576        # P10-S1's evaluation chunk (studies/p10s1/evaluate.py EVAL_CHUNK_ELEMENTS)

[caps]
# section 12: resource caps, "set after the rehearsal as charged + 2 x projected remaining"; section 14 estimates are placeholders until then.
# provisional = true makes the freeze refuse. The caps are charged hours on six workers; they are the only values the rehearsal may change.
provisional = false
rehearsal_hours = 1.0
a1_hours = 6.0
a2_hours = 3.0
total_hours = 10.0

[platform]
# section 13: platform of record
system = "Darwin"
machine = "arm64"
torch = "2.8.0"
torch_num_threads = 1
torch_interop_threads = 1
deterministic_algorithms = true

[seed_ranges]
# section 5 and registry section 4.2: the allocation of each role (inclusive); the seed gate (section 11 item 6) checks every planned value against these
bridge = [290001, 296999]
index = [298001, 298999]
rehearsal = [299201, 299299]
init = [330601, 330699]
test = [938001, 938999]
checker = "docs/reviews/p10-i-direction-2026-11-17/seed_registry_check_r3.py"
checker_sha256 = "e462360420321aa284b0e4d47b106806419ab616794a5c632fee70f122c67594"

[rehearsal]
# section 13: the rehearsal runs every stage end to end against a plan of its own: on a synthetic memory (tiny sizes, test seeds, a random backbone) and on one rehearsal-trained tree cell and one
# flat cell of the rehearsal draw (299201, initialisation 330692). The real-size cell is the largest one of the study (section 14: seconds per read at 16,384 slots and 32,768 facts).
facts = 32768
slots = 16384
updates = 64                   # P10-S1's rehearsal updates (studies/p10s1/core.py REHEARSAL_UPDATES): the cell is trained to be read, not to learn
snapshots = [32, 64]
synthetic_facts = 128
synthetic_slots = [1024, 4096]
synthetic_updates = 64          # a tiny memory is above the information floor from about 48 updates on (a_use 0.25 is at about 32): U_P 48, run length 64
synthetic_snapshots = [48, 64]
