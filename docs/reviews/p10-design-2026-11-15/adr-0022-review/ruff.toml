# Review scripts are kept byte-identical to the versions whose outputs are recorded here.
# Valid once this folder sits under docs/reviews/ (extends docs/reviews/ruff.toml). Checked before the move with:
#   uv run --locked ruff check --config docs/reviews/ruff.toml --extend-ignore E501,I001,E401,E702,F841,E701,E402,F401 <folder>/*.py
extend = "../../ruff.toml"

[lint]
ignore = ["E731", "E741", "B023", "F541", "E501", "I001", "E401", "E702", "F841", "E701", "E402", "F401"]
