[[row]]
title = "Quality versus dense alternatives"
score = 5
note = "Flat memory led dense at 16,384 updates; the lead shrank by 262,144 and neither had converged."
evidence = [
  "P10-I-S3 line 2 [FLAT]: MEMORY AHEAD (DENSE STILL IMPROVING), mean lead +0.0127 against 0.005, 27 of 27 cells ([outcome](results/p10i-s3-run-2026-11-18/OUTCOME.md)).",
  "P10-I-S6: CONVERGENCE NOT REACHED (BOTH STILL IMPROVING) at 262,144 updates; descriptive only: LEAD SHRINKING, mean lead +0.0124 at 16,384 updates and +0.0068 at 262,144; independently recomputed; accepted as registered ([outcome](results/p10i-s6-run-2026-11-20/OUTCOME.md), [acceptance](results/p10i-s6-run-2026-11-20/ACCEPTANCE.md)).",
  "P10-I-S1 (trained oracle-addressed store against the dense map, 1,024 to 16,384 slots): the dense map is ahead at its best snapshot in 5 of 5 replicates at 32K/16K (d from -0.80 to -0.85 bits) and at saturation at both loaded cells (d_sat -1.67 or lower), while the flat memory is ahead at equal updates and at matched compute at 32K/16K (+1.7 to +2.7 bits); descriptive; accepted as registered by the human lead on 2026-11-21 ([outcome](results/p10is1-run-2026-11-21/OUTCOME.md)).",
  "P10-I-S3 line 2 [TREE]: INCONCLUSIVE (MEMORY RATE AT EDGE). P10-I-R: the tree is behind the flat memory and no read-time cause is identified ([outcome](results/p10ir-run-2026-11-18/OUTCOME.md)).",
]
next = "The ordering at convergence is unknown: sixteen times the duration was not enough, and at the last rung both arms improve per doubling by more than the lead. No further study exists yet. The tree needs a training study that does not exist."

[[row]]
title = "Useful capacity scaling"
