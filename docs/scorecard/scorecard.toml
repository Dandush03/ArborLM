evidence = [
  "P4: registered capacity and slot-association criteria passed on a frozen backbone ([results](results/p4-2026-11-12/)).",
  "P10-I-S3 line 1: DEPENDENT on fresh data, read on the tree memory, not converged; the control passes largely because wrong values hurt ([outcome](results/p10i-s3-run-2026-11-18/OUTCOME.md)).",
  "P10-I-S6: D[FLAT] DEPENDENT at 262,144 updates, not converged and not dependence-qualified; it passes through harm (wrong values hurt), and reading the mean value row loses the gain ([outcome](results/p10i-s6-run-2026-11-20/OUTCOME.md)).",
]
next = "The flat memory's dependence at convergence is still unread: P10-I-S6 did not reach convergence. No study for it exists yet."

[[row]]
