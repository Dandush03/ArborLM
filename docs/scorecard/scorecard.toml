# ArborLM progress scorecard: the source of truth for the chart in README.md.
#
# The SCORES are the human lead's working estimate of how close each requirement of the target
# architecture is to being met. They are a planning aid. They are not registered results and not
# success claims. The EVIDENCE lines quote registered labels and link to their records.
#
# How to update (on every merge to main that adds or changes a registered outcome):
#   1. edit the row(s) below: evidence and next always; the score only when the human lead changes it
#      or confirms a proposed change;
#   2. set `updated` and `basis`;
#   3. run `uv run --locked python docs/scorecard/render_scorecard.py`;
#   4. commit this file, docs/scorecard/scorecard.svg and README.md together.
# `uv run --locked python docs/scorecard/render_scorecard.py --check` fails when they are out of step
# (tests/test_scorecard.py runs it).

updated = "2026-11-21"
basis = "main after the merges of P10-I-R, P10-I-S3, P10-I-S5, P10-I-S2 Part Q, ADR-0032, P10-I-S0, P10-I-S6 and P10-I-S1"
scale = "0 = nothing shown; 10 = shown at the scale the target architecture needs, replicated and accepted"

[[row]]
title = "External memory improves prediction"
